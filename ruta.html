<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ruta Técnico</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#f5f7fa;
}

.header{
    background:#136BFF;
    color:white;
    padding:20px;
}

#map{
    height:90vh;
    width:100%;
}

</style>

</head>

<body>

<div class="header">

    <h2 id="titulo">
        Ruta del técnico
    </h2>

</div>

<div id="map"></div>

<script>

const map = L.map('map')
.setView([10.920347,-74.864736],13);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom:19
    }
).addTo(map);

    const params =
new URLSearchParams(
    window.location.search
);

const tecnico =
params.get("tecnico");

document
.getElementById("titulo")
.textContent =
"Ruta de " + tecnico;

    fetch(
    "https://gps-tracking-api.modulo-de-exclusiones.workers.dev/?tecnico="
    +
    encodeURIComponent(tecnico)
)
.then(r => r.json())
.then(data => {

    console.log(data);

});
</script>

</body>
</html>
