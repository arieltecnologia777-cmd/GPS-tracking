<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ruta Técnico</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#f5f7fa;
}

.header{
    background:#136BFF;
    color:white;
    padding:20px;
}

#map{
    height:90vh;
    width:100%;
}
#infoRuta{

    position:absolute;

    top:90px;
    right:15px;

    z-index:999;

    background:white;

    border-radius:12px;

    padding:15px;

    min-width:220px;

    box-shadow:
    0 4px 20px rgba(0,0,0,.15);

    font-size:14px;

}

#infoRuta div{
    margin-bottom:8px;
}
</style>

</head>

<body>

<div class="header">

    <h2 id="titulo">
        Ruta del técnico
    </h2>

</div>
    <div id="infoRuta">

    <div><strong>Técnico:</strong> <span id="infoTecnico">-</span></div>

    <div><strong>Puntos:</strong> <span id="infoPuntos">0</span></div>

    <div><strong>Km:</strong> <span id="infoKm">0</span></div>

</div>

<div id="map"></div>

<script>

const map = L.map('map')
.setView([10.920347,-74.864736],13);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom:19
    }
).addTo(map);

    const params =
new URLSearchParams(
    window.location.search
);

const tecnico =
params.get("tecnico");

document
.getElementById("titulo")
.textContent =
"Ruta de " + tecnico;

    fetch(
    "https://gps-tracking-api.modulo-de-exclusiones.workers.dev/?tecnico="
    +
    encodeURIComponent(tecnico)
)
.then(r => r.json())
.then(data => {

    console.log(data);

    if(data.length === 0){
        return;
    }
document
.getElementById("infoTecnico")
.textContent =
tecnico;

document
.getElementById("infoPuntos")
.textContent =
data.length;

const kmMax = Math.max(
    ...data.map(
        p => Number(p.kilometros || 0)
    )
);

document
.getElementById("infoKm")
.textContent =
kmMax.toFixed(2);
    const puntos = data.map(p => [

        p.lat,
        p.lon

    ]);

   const puntoAzul = L.divIcon({
    className: "",
    html: `
        <div style="
            width:10px;
            height:10px;
            border-radius:50%;
            background:#53b8ff;
            border:2px solid #0b60ff;
            box-shadow:0 0 4px rgba(0,0,0,.4);
        "></div>
    `,
    iconSize:[10,10],
    iconAnchor:[5,5]
});

// INICIO (verde claro)

L.circleMarker(
    puntos[0],
    {
        radius:6,
        color:"#2bb673",
        fillColor:"#8ef0c0",
        fillOpacity:1,
        weight:2
    }
).addTo(map);


// MOTO (última ubicación)

const motoIcon = L.divIcon({

    className:"",

    html:`
        <div style="
            font-size:24px;
        ">
            🏍️
        </div>
    `,

    iconSize:[24,24],
    iconAnchor:[12,12]

});

L.marker(
    puntos[puntos.length - 1],
    {
        icon:motoIcon,
        zIndexOffset: 1000
    }
).addTo(map);


// RECORRIDO (azul)

if(puntos.length > 2){

    puntos.slice(1, puntos.length - 1)

    .forEach(punto => {

        L.marker(
            punto,
            {
                icon:puntoAzul
            }
        ).addTo(map);

    });

}

L.polyline(
    puntos,
    {
        color: "#136BFF",
        weight: 5,
        opacity: 0.8
    }
).addTo(map);

map.fitBounds(puntos);

});
</script>

</body>
</html>
