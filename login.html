<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dominic Tracking</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:#f5f7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:95%;
    max-width:400px;
    background:#fff;
    padding:30px;
    border-radius:16px;
    box-shadow:0 4px 20px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#0d6efd;
    font-size:28px;
}

.logo p{
    color:#666;
    margin-top:5px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:14px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#0d6efd;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    background:#0b5ed7;
}

.version{
    text-align:center;
    margin-top:15px;
    color:#888;
    font-size:12px;
}
</style>

</head>
<body>

<div class="card">

    <div class="logo">
        <h1>Dominic Tracking</h1>
        <p>Control Operativo GPS</p>
    </div>

    <form id="loginForm">

        <div class="form-group">
            <label>Usuario</label>
            <input
                type="text"
                id="usuario"
                placeholder="Ingrese su usuario"
                required>
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input
                type="password"
                id="password"
                placeholder="Ingrese su contraseña"
                required>
        </div>

        <button type="submit">
            Ingresar
        </button>

    </form>

    <div class="version">
        Dominic Tracking v1.0
    </div>

</div>

<script>

document
.getElementById("loginForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const usuario =
    document.getElementById("usuario").value;

    localStorage.setItem(
        "tecnico",
        usuario
    );

    window.location.href =
    "dashboard.html";

});

</script>

</body>
</html>
