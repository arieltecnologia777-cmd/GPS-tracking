<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dominic Tracking</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

:root{
    --primary:#136BFF;
}

body{
    background:#f5f7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.assistant-card{
    display:flex;
    align-items:center;
    gap:15px;
    background:var(--primary);
    color:white;
    border-radius:16px;
    padding:16px;
    margin-bottom:25px;
}

.dominic-img{
    width:75px;
    height:75px;
    object-fit:contain;
    flex-shrink:0;
}

.assistant-card h2{
    font-size:18px;
    margin-bottom:4px;
}

.assistant-card p{
    font-size:13px;
    line-height:1.3;
}

.assistant-card span{
    display:block;
    margin-top:5px;
    font-size:12px;
    font-weight:600;
}

.form-group{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d7dce5;
    border-radius:10px;
    font-size:14px;
}

input:focus{
    outline:none;
    border-color:#136BFF;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#136BFF;
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    opacity:.95;
}

.dominion-container{
    text-align:center;
    margin-top:25px;
}

.dominion-logo{
    width:160px;
    max-width:100%;
}

    .dominic-img{
    width:70px;
    height:70px;
    object-fit:contain;
    flex-shrink:0;
}

.dominion-logo{
    width:160px;
    max-width:100%;
}
</style>
</head>

<body>

<div class="card">

    <div class="assistant-card">

    <img
    src="assistant_casco.png"
    alt="Dominic"
    class="

    <div>

        <h2>¡Hola, soy Dominic!</h2>

        <p>
            Gestiono el seguimiento operativo
            de técnicos en campo
        </p>

        <span>
            Versión v1.0.0
        </span>

    </div>

</div>

    <form id="loginForm">

        <div class="form-group">
            <input
                type="text"
                id="usuario"
                placeholder="Usuario"
                required
            >
        </div>

        <div class="form-group">
            <input
                type="password"
                id="password"
                placeholder="Contraseña"
                required
            >
        </div>

        <button type="submit">
            Ingresar
        </button>

    </form>

    <div class="dominion-container">

    <img
    src="dominion_logo.png"
    alt="Dominion"
    class="dominion-logo"
>

</div>

</div>

<script>

document
.getElementById("loginForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const usuario =
        document.getElementById("usuario").value;

    localStorage.setItem(
        "tecnico",
        usuario
    );

    window.location.href =
        "dashboard.html";

});

</script>

</body>
</html>
