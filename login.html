<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dominic Tracking</title>

<style>

:root{
    --primary:#136BFF;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Roboto,Arial,sans-serif;

    background:
    linear-gradient(
        135deg,
        #e9f2ff,
        #f7f9ff
    );
}

.login-card{

    width:390px;

    background:#fff;

    border-radius:20px;

    padding:30px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.12);

    text-align:center;

}

.assistant{

    display:flex;
    align-items:center;
    gap:12px;

    background:var(--primary);

    border-radius:16px;

    padding:14px;

    color:white;

    text-align:left;

    margin-bottom:25px;

}

.assistant img{

    width:60px;
    height:60px;
    border-radius:50%;

    object-fit:cover;

    background:white;

}

.assistant-title{

    font-size:22px;
    font-weight:700;

}

.assistant-sub{

    font-size:13px;
    opacity:.9;

}

.version{

    font-size:12px;
    margin-top:4px;
    opacity:.9;

}

input{

    width:100%;

    padding:12px 14px;

    border:1px solid #dfe5ef;

    border-radius:12px;

    margin-bottom:12px;

    font-size:14px;

}

input:focus{

    outline:none;

    border-color:var(--primary);

}

button{

    width:100%;

    border:none;

    padding:13px;

    border-radius:12px;

    background:var(--primary);

    color:white;

    font-weight:700;

    cursor:pointer;

}

button:hover{

    filter:brightness(.95);

}

.logo{

    margin-top:25px;

}

.logo img{

    width:140px;

}

</style>
</head>

<body>

<div class="login-card">

    <div class="assistant">

        assistant_casco.png

        <div>

            <div class="assistant-title">
                ¡Hola, soy Dominic!
            </div>

            <div class="assistant-sub">
                Gestiono tu rastreo GPS de manera inteligente
            </div>

            <div class="version">
                Versión v1.0.0
            </div>

        </div>

    </div>

    <input
        id="usuario"
        type="text"
        placeholder="Usuario">

    <input
        id="password"
        type="password"
        placeholder="Contraseña">

    <button id="btnLogin">
        Ingresar
    </button>

    <div class="logo">
        dominion_logo.png
    </div>

</div>

</body>
</html>
