<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dominic Tracking</title>

<style>

:root{
    --primary:#136BFF;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:#f5f7fa;
    padding:20px;
}

.header{
    background:#136BFF;
    color:white;
    border-radius:18px;
    padding:20px;
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.header img{
    width:70px;
    height:70px;
    object-fit:contain;
}

.header h2{
    margin-bottom:4px;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.kpi{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
}

.kpi strong{
    color:#136BFF;
}

.estado{
    font-size:18px;
    font-weight:700;
    color:#ff4d4d;
}

.botones{
    display:flex;
    gap:10px;
}

button{
    flex:1;
    border:none;
    border-radius:12px;
    padding:14px;
    font-weight:700;
    cursor:pointer;
}

.btnInicio{
    background:#136BFF;
    color:white;
}

.btnFin{
    background:#e9eef7;
}

</style>
</head>
<body>

<div class="header">

    assistant_casco.png

    <div>
        <h2 id="saludo">
            Hola Técnico
        </h2>

        <div>
            Seguimiento operativo GPS
        </div>
    </div>

</div>

<div class="card">

    <div class="estado" id="estadoGps">
        🔴 GPS Inactivo
    </div>

</div>

<div class="card">

    <div class="kpi">
        <span>Hora inicio</span>
        <strong id="horaInicio">--</strong>
    </div>

    <div class="kpi">
        <span>Kilómetros</span>
        <strong id="kms">0</strong>
    </div>

    <div class="kpi">
    <span>Latitud</span>
    <strong id="latitud">--</strong>
</div>

<div class="kpi">
    <span>Longitud</span>
    <strong id="longitud">--</strong>
</div>

<div class="kpi">
    <span>Precisión</span>
    <strong id="precision">--</strong>
</div>

</div>


<div class="botones">

    <button
        class="btnInicio"
        id="btnIniciar">
        ▶ Iniciar jornada
    </button>

    <button
        class="btnFin"
        id="btnFinalizar">
        ■ Finalizar jornada
    </button>

</div>

<script>

let watchId = null;
let totalPuntos = 0;
let historialGPS = [];
let kilometros = 0;

function distanciaMetros(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371000;

    const dLat =
    (lat2 - lat1) *
    Math.PI / 180;

    const dLon =
    (lon2 - lon1) *
    Math.PI / 180;

    const a =

        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(lat1 * Math.PI / 180) *

        Math.cos(lat2 * Math.PI / 180) *

        Math.sin(dLon / 2) *

        Math.sin(dLon / 2);

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;

}

const tecnico =
localStorage.getItem("tecnico") || "Técnico";

document
.getElementById("saludo")
.textContent =
"Hola " + tecnico;

document
.getElementById("btnIniciar")
.addEventListener("click", () => {

    document
    .getElementById("estadoGps")
    .innerHTML =
    "🟢 GPS Activo";

    document
    .getElementById("horaInicio")
    .textContent =
    new Date()
    .toLocaleTimeString();

    totalPuntos = 0;
    historialGPS = [];
    kilometros = 0;

    document
    .getElementById("puntos")
    .textContent = 0;

    document
    .getElementById("kms")
    .textContent = "0.00";

    navigator.geolocation.getCurrentPosition(

        function(pos){

            historialGPS.push({

                lat: pos.coords.latitude,

                lon: pos.coords.longitude,

                fecha: new Date()

            });

            if(
                historialGPS.length > 1
            ){

                const anterior =
                historialGPS[
                    historialGPS.length - 2
                ];

                kilometros +=
                distanciaMetros(

                    anterior.lat,
                    anterior.lon,

                    pos.coords.latitude,
                    pos.coords.longitude

                );

                document
                .getElementById("kms")
                .textContent =
                (kilometros / 1000)
                .toFixed(2);

            }

            document
            .getElementById("latitud")
            .textContent =
            pos.coords.latitude.toFixed(6);

            document
            .getElementById("longitud")
            .textContent =
            pos.coords.longitude.toFixed(6);

            document
            .getElementById("precision")
            .textContent =
            Math.round(
                pos.coords.accuracy
            ) + " m";

        },

        function(error){

            console.error(error);

            alert(
                "No fue posible obtener la ubicación GPS"
            );

        },

        {
            enableHighAccuracy:true,
            maximumAge:0
        }

    );

});

document
.getElementById("btnFinalizar")
.addEventListener("click", () => {

    if(watchId){

        navigator
        .geolocation
        .clearWatch(watchId);

        watchId = null;

    }

    document
    .getElementById("estadoGps")
    .innerHTML =
    "🔴 GPS Inactivo";

});

</script>

</body>
</html>
